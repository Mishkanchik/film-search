<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4081;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="32" fill="#0f0f1e" stroke="url(#neonGrad)" stroke-width="4"/>
  <!-- Neon Movie icon -->
  <g filter="url(#neonGlow)">
    <!-- Clapperboard Outline -->
    <path d="M34 44H94V84C94 88.4 90.4 92 86 92H42C37.6 92 34 88.4 34 84V44Z" fill="none" stroke="url(#neonGrad)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M34 44H94L86 32H42L34 44Z" fill="url(#neonGrad)"/>
    <!-- Stripes -->
    <line x1="45" y1="32" x2="55" y2="44" stroke="#0f0f1e" stroke-width="4" />
    <line x1="61" y1="32" x2="71" y2="44" stroke="#0f0f1e" stroke-width="4" />
    <line x1="77" y1="32" x2="87" y2="44" stroke="#0f0f1e" stroke-width="4" />
    <!-- Play Triangle -->
    <polygon points="56,58 78,70 56,82" fill="#ffffff" />
  </g>
</svg>
